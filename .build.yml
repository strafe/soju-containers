image: archlinux
packages:
  - podman
sources:
  - https://codeberg.org/emersion/soju-containers.git
secrets:
  - 106c7011-4e0e-4b33-a3f2-ffea55ce3f4b # codeberg package registry token
tasks:
  - build: |
      cd soju-containers
      for image in soju gamja; do
        podman build \
          --platform linux/amd64,linux/arm64,linux/arm/v6 \
          --target $image \
          --manifest $image \
          --build-arg-file argfile.conf \
          $image
      done
  - deploy: |
      cd soju-containers
      [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/master)" ] || complete-build
      podman login codeberg.org --username emersion --password-stdin <~/codeberg-token.txt
      podman manifest push soju codeberg.org/emersion/soju
      podman manifest push gamja codeberg.org/emersion/gamja
